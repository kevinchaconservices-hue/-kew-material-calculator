<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>KEW Material Calculator V4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#111827}main{max-width:800px;margin:auto;padding:16px}h1{font-size:23px;margin:0}.muted{color:#6b7280;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.badge{background:#dcfce7;color:#166534;padding:6px 9px;border-radius:999px;font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{min-height:44px;padding:9px 13px;border:1px solid #ddd;border-radius:11px;background:#fff;white-space:nowrap}.tab.active{background:#111827;color:#fff}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}label{display:block;font-size:13px;color:#6b7280;margin-bottom:5px}input,select{width:100%;min-height:44px;border:1px solid #d1d5db;border-radius:10px;padding:9px;font-size:16px;background:#fff}.btn{min-height:44px;border-radius:10px;padding:9px 13px;font-weight:700}.primary{background:#111827;color:#fff;border:0}.secondary{background:#fff;border:1px solid #d1d5db}.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}.row{display:flex;gap:8px;flex-wrap:wrap}.results{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f9fafb;border-radius:12px;padding:11px}.metric small{display:block;color:#6b7280}.metric strong{display:block;font-size:20px;margin:2px 0}.room{border:1px solid #e5e7eb;border-radius:13px;padding:12px;margin-top:10px}.roomhead{display:flex;justify-content:space-between;gap:8px;align-items:center}.checks{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.checks label{display:flex;gap:6px;align-items:center;background:#f9fafb;padding:8px;border-radius:9px;color:#111827}.checks input{width:auto;min-height:auto}.total{font-size:27px;font-weight:800}.item{display:flex;justify-content:space-between;gap:10px;padding:9px;border-bottom:1px solid #eee}.price{font-weight:700}@media(max-width:520px){.grid,.results{grid-template-columns:1fr}}
</style></head><body><main>
<div class="top"><div><h1>KEW Material Calculator</h1><div class="muted">Professional takeoff & pricing · V4</div></div><span class="badge">Offline</span></div>

<div class="tabs"><button class="tab active" data-tab="project">🏠 Project</button><button class="tab" data-tab="materials">🧰 Materials</button><button class="tab" data-tab="budget">💷 Quote</button><button class="tab" data-tab="saved">💾 Saved</button></div>

<section class="card"><h2 style="font-size:18px;margin:0 0 10px">Project</h2>
<div class="grid"><div><label>Client / project</label><input id="project" placeholder="Smith House"></div><div><label>Default wall height (m)</label><input id="height" type="number" min="0" step=".01" value="2.4"></div></div>
<div id="rooms"></div><div class="row" style="margin-top:11px"><button class="btn secondary" id="add" type="button">+ Add room</button><button class="btn primary" id="calculate" type="button" style="flex:1">Calculate everything</button></div></section>

<section class="card"><h2 style="font-size:18px;margin:0 0 10px">Materials settings</h2>
<div class="grid">
<div><label>Paint coverage (m²/L)</label><input id="coverage" type="number" min="0" value="12"></div><div><label>Paint coats</label><input id="coats" type="number" min="1" value="2"></div>
<div><label>Paint waste (%)</label><input id="paintWaste" type="number" min="0" value="10"></div><div><label>Floor waste (%)</label><input id="floorWaste" type="number" min="0" value="10"></div>
<div><label>Paint price / 10L (£)</label><input id="paintPrice" type="number" min="0" step=".01" value="85"></div><div><label>Underlay m² / pack</label><input id="underlayPack" type="number" min="0" value="15"></div>
<div><label>Underlay price / pack (£)</label><input id="underlayPrice" type="number" min="0" step=".01" value="25"></div><div><label>Laminate / LVT price / m² (£)</label><input id="floorPrice" type="number" min="0" step=".01" value="20"></div>
<div><label>Skirting piece length (m)</label><input id="skirtPiece" type="number" min="0" step=".01" value="2.4"></div><div><label>Skirting price / piece (£)</label><input id="skirtPrice" type="number" min="0" step=".01" value="12"></div>
</div></section>

<section class="card"><h2 style="font-size:18px;margin:0 0 10px">Takeoff</h2><div id="results" class="results"></div><div id="list" style="margin-top:10px"></div><p id="note" class="muted"></p></section>

<section class="card"><h2 style="font-size:18px;margin:0 0 10px">Quote</h2><div class="grid"><div><label>Labour (£)</label><input id="labour" type="number" min="0" step=".01" value="1200"></div><div><label>Other costs (£)</label><input id="other" type="number" min="0" step=".01" value="100"></div><div><label>Profit margin (%)</label><input id="margin" type="number" min="0" step=".1" value="20"></div></div><div class="card" style="background:#f9fafb;margin:12px 0 0"><div class="muted">Recommended client price</div><div id="total" class="total">£0.00</div></div></section>

<section class="card"><h2 style="font-size:18px;margin:0 0 10px">Saved projects</h2><div class="row"><button class="btn secondary" id="save" type="button">Save current project</button><button class="btn danger" id="clear" type="button">Clear</button></div><div id="saved" style="margin-top:10px"></div></section>

<script>
(()=>{let count=0,last={};const $=id=>document.getElementById(id),v=id=>Math.max(0,parseFloat($(id)?.value)||0);
function addRoom(name='Room '+(count+1)){count++;let d=document.createElement('div');d.className='room';d.innerHTML=`<div class="roomhead"><b>${name}</b><button type="button" class="btn danger remove">Remove</button></div><div class="grid" style="margin-top:9px"><div><label>Room name</label><input class="name" value="${name}"></div><div><label>Work</label><select class="work"><option value="both">Paint + Flooring</option><option value="paint">Paint only</option><option value="floor">Flooring only</option><option value="skirt">Skirting only</option></select></div><div><label>Length (m)</label><input class="l" type="number" min="0" value="4.5" step=".01"></div><div><label>Width (m)</label><input class="w" type="number" min="0" value="3.8" step=".01"></div><div><label>Doors</label><input class="doors" type="number" min="0" value="1" step="1"></div><div><label>Windows</label><input class="windows" type="number" min="0" value="1" step="1"></div></div><div class="checks"><label><input class="ceiling" type="checkbox"> Paint ceiling</label><label><input class="wood" type="checkbox"> Paint woodwork</label></div>`;d.querySelector('.remove').onclick=()=>d.remove();$('rooms').appendChild(d)}
function met(a,b,c=''){return `<div class="metric"><small>${a}</small><strong>${b}</strong><small>${c}</small></div>`}
function calc(){let pa=0,fa=0,ceil=0,per=0;document.querySelectorAll('.room').forEach(r=>{let l=vEl(r,'.l'),w=vEl(r,'.w'),h=vEl(r,'.h')||v('height'),doors=vEl(r,'.doors'),wins=vEl(r,'.windows'),work=r.querySelector('.work').value;let floor=l*w,walls=Math.max(0,2*(l+w)*h-doors*1.8-wins*1.2);if(work==='both'||work==='paint')pa+=walls;if(work==='both'||work==='floor')fa+=floor;if(work==='both'||work==='paint')if(r.querySelector('.ceiling').checked)ceil+=floor;if(work==='both'||work==='skirt')per+=2*(l+w)-doors*0.9});
let paintArea=pa+ceil,paintL=paintArea*v('coats')/v('coverage')*(1+v('paintWaste')/100),paint10=Math.ceil(paintL/10),floorNeed=fa*(1+v('floorWaste')/100),under=v('underlayPack')?Math.ceil(floorNeed/v('underlayPack')):0,skirtNeed=per*(1+v('floorWaste')/100),pieces=v('skirtPiece')?Math.ceil(skirtNeed/v('skirtPiece')):0;
let paintCost=paint10*v('paintPrice'),underCost=under*v('underlayPrice'),floorCost=floorNeed*v('floorPrice'),skirtCost=pieces*v('skirtPrice'),materials=paintCost+underCost+floorCost+skirtCost,base=materials+v('labour')+v('other'),profit=base*v('margin')/100,total=base+profit;
$('results').innerHTML=met('Paint area',paintArea.toFixed(1)+' m²')+met('Paint to buy',paint10*10+' L',paint10+' × 10L')+met('Flooring',floorNeed.toFixed(2)+' m²','incl. waste')+met('Underlay',under+' packs')+met('Skirting',pieces+' pcs',pieces+' × '+v('skirtPiece')+' m')+met('Materials cost','£'+materials.toFixed(2));$('list').innerHTML=[['🎨 Paint',paint10+' × 10L','£'+paintCost.toFixed(2)],['🪵 Flooring',floorNeed.toFixed(2)+' m²','£'+floorCost.toFixed(2)],['◻️ Underlay',under+' packs','£'+underCost.toFixed(2)],['📏 Skirting',pieces+' pcs','£'+skirtCost.toFixed(2)]].map(x=>`<div class="item"><span>${x[0]}<br><small>${x[1]}</small></span><b class="price">${x[2]}</b></div>`).join('');$('total').textContent='£'+total.toFixed(2);$('note').textContent='Prices are editable estimates stored locally; no internet is required for calculations.';last={paintArea,floorNeed,under,skirtPieces:pieces,materials,labour:v('labour'),other:v('other'),profit,total};return last}
function vEl(r,s){return Math.max(0,parseFloat(r.querySelector(s)?.value)||0)}
function snap(){return{project:$('project').value,height:$('height').value,coverage:$('coverage').value,coats:$('coats').value,paintWaste:$('paintWaste').value,floorWaste:$('floorWaste').value,paintPrice:$('paintPrice').value,underlayPack:$('underlayPack').value,underlayPrice:$('underlayPrice').value,floorPrice:$('floorPrice').value,skirtPiece:$('skirtPiece').value,skirtPrice:$('skirtPrice').value,labour:$('labour').value,other:$('other').value,margin:$('margin').value,rooms:[...document.querySelectorAll('.room')].map(r=>({name:r.querySelector('.name').value,work:r.querySelector('.work').value,l:r.querySelector('.l').value,w:r.querySelector('.w').value,doors:r.querySelector('.doors').value,windows:r.querySelector('.windows').value,ceiling:r.querySelector('.ceiling').checked,wood:r.querySelector('.wood').checked}))}}
function restore(s){$('rooms').innerHTML='';count=0;Object.keys(s).forEach(k=>{if($(k)&&k!=='project')$(k).value=s[k]});$('project').value=s.project||'';(s.rooms||[]).forEach(x=>{addRoom(x.name);let r=$('rooms').lastElementChild;r.querySelector('.work').value=x.work;r.querySelector('.l').value=x.l;r.querySelector('.w').value=x.w;r.querySelector('.doors').value=x.doors;r.querySelector('.windows').value=x.windows;r.querySelector('.ceiling').checked=x.ceiling;r.querySelector('.wood').checked=x.wood})}
function showSaved(){let a=JSON.parse(localStorage.getItem('kewV4')||'[]');$('saved').innerHTML=a.map((x,i)=>`<div class="item"><span><b>${x.project||'Unnamed'}</b><br><small>${x.date} · ${(x.rooms||[]).length} rooms</small></span><button class="btn secondary load" data-i="${i}" type="button">Load</button></div>`).join('');document.querySelectorAll('.load').forEach(b=>b.onclick=()=>restore(a[+b.dataset.i]))}
$('add').onclick=()=>addRoom();$('calculate').onclick=calc;$('save').onclick=()=>{calc();let a=JSON.parse(localStorage.getItem('kewV4')||'[]');a.unshift({...snap(),date:new Date().toLocaleDateString('en-GB')});localStorage.setItem('kewV4',JSON.stringify(a.slice(0,30)));showSaved()};$('clear').onclick=()=>{localStorage.removeItem('kewV4');location.reload()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b)));
addRoom('Living Room');addRoom('Bedroom 1');calc();showSaved();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();</script></main></body></html>
